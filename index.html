<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>機甲矩陣 - 乘法空間特訓 📐</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --accent-cyan: #38bdf8;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --accent-red: #ff7675;
            --text-color: #f8fafc;
            --btn-bg: #334155;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

        body {
            font-family: "Chalkboard SE", "Comic Sans MS", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden;
        }

        /* 雙層背景防呆：圖檔載入失敗自動退回科幻漸層 */
        .battle-bg-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            overflow: hidden; pointer-events: none;
        }
        .battle-bg-img {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.65;
        }

        .app-container {
            width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px 15px; padding-bottom: max(12px, env(safe-area-inset-bottom)); position: relative;
        }

        .hud {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 41, 59, 0.85); padding: 6px 12px; border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(5px);
        }
        .hud-btn-group { display: flex; gap: 6px; }
        .hud-icon-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 0.95rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }

        /* 新增心心血量 UI */
        .hp-box {
            font-size: 1.2rem; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 8px rgba(255, 118, 117, 0.8);
        }
        .hp-box.shake { animation: hpShake 0.3s ease; }
        @keyframes hpShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .score-box { text-align: right; }
        .score-box div { font-size: 0.65rem; color: #94a3b8; }
        .score-box span { font-size: 0.95rem; font-weight: bold; color: var(--accent-cyan); }

        .progress-text { text-align: center; font-size: 0.85rem; color: var(--accent-yellow); font-weight: bold; margin: 4px 0; }

        .main-game-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; width: 100%; min-height: 0; position: relative;
        }

        .robot-stage {
            position: relative; width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center; margin-bottom: 4px;
        }
        .robot-img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(56, 189, 248, 0.4));
            animation: floatRobot 2.5s ease-in-out infinite;
        }
        @keyframes floatRobot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .question-title { font-size: 1.15rem; font-weight: bold; color: var(--accent-cyan); margin-bottom: 6px; text-align: center; }

        .matrix-card {
            background: var(--card-bg); border: 2px solid var(--accent-cyan);
            border-radius: 20px; padding: 12px; width: 100%; max-width: 280px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.2); margin-bottom: 8px; position: relative;
        }
        .matrix-grid { display: grid; gap: 4px; padding: 6px; background: #0f172a; border-radius: 12px; }
        .matrix-cell {
            width: 20px; height: 22px; background: #1e293b; border-radius: 4px;
            transition: all 0.2s; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .matrix-cell.active { background: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan); border-color: #fff; }

        .boom-effect {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 180px; height: 180px; pointer-events: none; opacity: 0; z-index: 10;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
        }
        .boom-effect.active { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: auto; }
        .opt-btn {
            background: var(--btn-bg); border: none; border-bottom: 4px solid #1e293b;
            border-radius: 16px; padding: 14px 0; font-size: 1.4rem; font-weight: bold;
            color: #fff; cursor: pointer; transition: all 0.08s ease;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .opt-btn:active { transform: translateY(2px); border-bottom-width: 2px; background: #475569; }
        .opt-btn.correct { background: var(--accent-green) !important; color: #0f172a !important; }
        .opt-btn.wrong { background: #ef4444 !important; color: #fff !important; }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(5px);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .modal-card {
            background: var(--card-bg); border: 3px solid var(--accent-cyan);
            border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3); transition: border-color 0.3s;
        }

        .modal-card.lose-theme {
            border-color: var(--accent-red);
            box-shadow: 0 10px 30px rgba(255, 118, 117, 0.4);
            animation: pulseRed 1.5s infinite;
        }
        @keyframes pulseRed { 0%, 100% { border-color: var(--accent-red); } 50% { border-color: #d63031; } }

        .menu-btn {
            background: transparent; border: 2px solid var(--accent-cyan);
            color: white; padding: 12px 20px; margin: 8px 0; font-size: 1.1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; width: 100%; transition: all 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); background: var(--accent-cyan); color: #000; }
        .level-tag { font-size: 0.8rem; opacity: 0.8; display: block; margin-top: 2px; color: var(--accent-yellow); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 雙層背景容器 -->
    <div class="battle-bg-container">
        <img src="bg.png" class="battle-bg-img" onerror="this.style.display='none';">
    </div>

    <div class="app-container">
        <div class="hud">
            <div class="hud-btn-group">
                <button class="hud-icon-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
                <button class="hud-icon-btn" id="vibrate-btn" onclick="toggleVibrate()">📳</button>
                <button class="hud-icon-btn" onclick="openLevelSelect()" title="返回選單">🏠</button>
                <button class="hud-icon-btn" onclick="togglePause()">⏸️</button>
            </div>
            <!-- 心心血量顯示區 -->
            <div class="hp-box" id="hp-display">❤️❤️❤️</div>
            <div class="score-box">
                <div>BEST: <span id="high-score">0</span></div>
                <div>SCORE: <span id="score">0</span></div>
            </div>
        </div>

        <div class="progress-text">矩陣進度：<span id="current-q-num">1</span> / 25</div>

        <div class="main-game-area">
            <div class="robot-stage">
                <img src="hero.png" id="robot-hero-img" class="robot-img" onerror="this.style.display='none'; document.getElementById('emoji-robot').style.display='block';">
                <span id="emoji-robot" style="font-size:3.8rem; display:none;">🤖</span>
            </div>

            <div class="question-title" id="question-text">4 × 3 = ?</div>
            
            <div class="matrix-card">
                <div class="matrix-grid" id="matrix-grid"></div>
                <div id="boom-box" class="boom-effect">
                    <img src="boom.png" style="width:100%; height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('emoji-boom').style.display='block';">
                    <span id="emoji-boom" style="font-size:4.5rem; display:none;">💥</span>
                </div>
            </div>
        </div>

        <div class="options-grid" id="options-grid"></div>

        <!-- 關卡選擇彈窗 -->
        <div id="level-modal" class="modal">
            <div class="modal-card">
                <div style="height: 70px; display:flex; justify-content:center; align-items:center; margin-bottom:10px;">
                    <img src="hero.png" style="max-height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('modal-emoji').style.display='block';">
                    <span id="modal-emoji" style="font-size:3.5rem; display:none;">📐</span>
                </div>
                <h2 style="color:var(--accent-cyan); margin: 5px 0;">乘法矩陣特訓</h2>
                <p style="color:#94a3b8; font-size:0.85rem; margin-bottom:15px;">選擇要特訓的九九乘法範疇</p>
                <button class="menu-btn" onclick="selectLevel(1)">1️⃣ 基礎矩陣 (2, 3, 4, 5 段)<span class="level-tag">視覺化面積點陣感知</span></button>
                <button class="menu-btn" onclick="selectLevel(2)">2️⃣ 進階矩陣 (6, 7, 8, 9 段)<span class="level-tag">高階乘法點陣聯想</span></button>
                <button class="menu-btn" onclick="selectLevel(3)">3️⃣ 全九九乘法大亂鬥<span class="level-tag">全範圍隨機矩陣綜合</span></button>
            </div>
        </div>

        <!-- 訊息/失敗彈窗 -->
        <div id="msg-modal" class="modal hidden">
            <div class="modal-card" id="msg-card">
                <h2 id="msg-title" style="margin-top:0;">標題</h2>
                <p id="msg-body">內容說明</p>
                <button class="menu-btn" onclick="restartGame()">↺ 重新挑戰</button>
                <button class="menu-btn" onclick="openLevelSelect()">🏠 選擇關卡</button>
            </div>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('matrix_high_score')) || 0;
        let hp = 3;
        let maxHp = 3;
        let questionCount = 0;
        let maxQuestions = 25;
        let currentQuestion = null;
        let isAnsweringLocked = false;
        let soundEnabled = true;
        let vibrateEnabled = true;

        document.getElementById('high-score').innerText = highScore;

        function updateHpUI() {
            let hpStr = "";
            for (let i = 0; i < maxHp; i++) {
                hpStr += (i < hp) ? "❤️" : "🖤";
            }
            document.getElementById('hp-display').innerText = hpStr;
        }

        function selectLevel(lvl) {
            currentLevel = lvl;
            document.getElementById('level-modal').classList.add('hidden');
            restartGame();
        }

        function openLevelSelect() {
            document.getElementById('msg-modal').classList.add('hidden');
            document.getElementById('level-modal').classList.remove('hidden');
        }

        function restartGame() {
            score = 0;
            hp = maxHp;
            questionCount = 0;
            isAnsweringLocked = false;
            document.getElementById('score').innerText = score;
            document.getElementById('msg-modal').classList.add('hidden');
            updateHpUI();
            nextQuestion();
        }

        function generateQuestion() {
            let rows, cols;
            if (currentLevel === 1) {
                rows = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                cols = Math.floor(Math.random() * 9) + 1;
            } else if (currentLevel === 2) {
                rows = [6, 7, 8, 9][Math.floor(Math.random() * 4)];
                cols = Math.floor(Math.random() * 9) + 1;
            } else {
                rows = Math.floor(Math.random() * 9) + 1;
                cols = Math.floor(Math.random() * 9) + 1;
            }

            let ans = rows * cols;
            let options = [ans];

            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrongAns = ans + offset;
                if (wrongAns > 0 && !options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            options.sort(() => Math.random() - 0.5);

            return { rows, cols, ans, options };
        }

        function renderMatrix(rows, cols) {
            const grid = document.getElementById('matrix-grid');
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell active';
                    grid.appendChild(cell);
                }
            }
        }

        function nextQuestion() {
            if (questionCount >= maxQuestions) {
                showWinModal();
                return;
            }

            questionCount++;
            document.getElementById('current-q-num').innerText = questionCount;
            currentQuestion = generateQuestion();
            isAnsweringLocked = false;

            document.getElementById('question-text').innerText = `${currentQuestion.rows} × ${currentQuestion.cols} = ?`;
            renderMatrix(currentQuestion.rows, currentQuestion.cols);

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            currentQuestion.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });

            speakCurrentQuestion();
        }

        function checkAnswer(selectedOpt, btn) {
            if (isAnsweringLocked) return;

            if (selectedOpt === currentQuestion.ans) {
                isAnsweringLocked = true;
                btn.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('matrix_high_score', highScore);
                    document.getElementById('high-score').innerText = highScore;
                }

                const boom = document.getElementById('boom-box');
                boom.classList.add('active');
                setTimeout(() => boom.classList.remove('active'), 500);

                setTimeout(() => nextQuestion(), 600);
            } else {
                btn.classList.add('wrong');
                hp--;
                updateHpUI();

                const hpBox = document.getElementById('hp-display');
                hpBox.classList.add('shake');
                setTimeout(() => hpBox.classList.remove('shake'), 300);

                if (vibrateEnabled && navigator.vibrate) navigator.vibrate(200);

                if (hp <= 0) {
                    isAnsweringLocked = true;
                    setTimeout(() => showLoseModal(), 500);
                } else {
                    setTimeout(() => btn.classList.remove('wrong'), 600);
                }
            }
        }

        function showLoseModal() {
            const card = document.getElementById('msg-card');
            card.className = 'modal-card lose-theme';
            document.getElementById('msg-title').innerHTML = "💔 矩陣過載！";
            document.getElementById('msg-title').style.color = "var(--accent-red)";
            document.getElementById('msg-body').innerText = `機甲能量耗盡，本次獲得分數：${score} 分`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function showWinModal() {
            const card = document.getElementById('msg-card');
            card.className = 'modal-card';
            document.getElementById('msg-title').innerHTML = "🎉 特訓完成！";
            document.getElementById('msg-title').style.color = "var(--accent-cyan)";
            document.getElementById('msg-body').innerText = `恭喜完成 25 題乘法矩陣特訓！最終得分：${score} 分`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function speakCurrentQuestion() {
            if (!soundEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let text = `${currentQuestion.rows} 乘以 ${currentQuestion.cols} 等於多少？`;
            let utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = 0.9;
            window.speechSynthesis.speak(utter);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? "🔊" : "🔇";
        }

        function toggleVibrate() {
            vibrateEnabled = !vibrateEnabled;
            document.getElementById('vibrate-btn').innerText = vibrateEnabled ? "📳" : "🔕";
        }

        function togglePause() {
            const card = document.getElementById('msg-card');
            card.className = 'modal-card';
            document.getElementById('msg-title').innerHTML = "⏸️ 遊戲暫停";
            document.getElementById('msg-title').style.color = "var(--accent-yellow)";
            document.getElementById('msg-body').innerText = `當前得分：${score} 分`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
