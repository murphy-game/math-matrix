<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>機甲矩陣 - 乘法空間特訓 📐</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --accent-pink: #f472b6;
            --text-color: #f8fafc;
            --btn-bg: #334155;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

        body {
            font-family: "Chalkboard SE", "Comic Sans MS", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px 15px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            position: relative;
        }

        /* 頂部 HUD */
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 41, 59, 0.8); padding: 6px 12px; border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(5px);
        }
        .hud-btn-group { display: flex; gap: 6px; }
        .hud-icon-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 0.95rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .score-box { text-align: right; }
        .score-box div { font-size: 0.65rem; color: #94a3b8; }
        .score-box span { font-size: 0.95rem; font-weight: bold; color: var(--accent-cyan); }
        .score-box .high-score { color: var(--accent-yellow); margin-right: 4px; }

        .progress-text {
            text-align: center; font-size: 0.85rem; color: var(--accent-yellow);
            font-weight: bold; margin: 4px 0;
        }

        /* 主遊戲區域 */
        .main-game-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; width: 100%; min-height: 0;
        }

        .question-title {
            font-size: 1.2rem; font-weight: bold; color: var(--accent-cyan);
            margin-bottom: 8px; text-align: center;
        }

        /* 矩陣畫布/容器 */
        .matrix-card {
            background: var(--card-bg); border: 2px solid var(--accent-cyan);
            border-radius: 20px; padding: 12px; width: 100%; max-width: 280px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.15); margin-bottom: 8px;
        }

        .matrix-grid {
            display: grid; gap: 4px; padding: 6px; background: #0f172a; border-radius: 12px;
        }

        .matrix-cell {
            width: 22px; height: 22px; background: #1e293b; border-radius: 4px;
            transition: all 0.2s; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .matrix-cell.active {
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            border-color: #fff;
        }

        /* 4 個選項區域 */
        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: auto;
        }

        .opt-btn {
            background: var(--btn-bg); border: none; border-bottom: 4px solid #1e293b;
            border-radius: 16px; padding: 14px 0; font-size: 1.4rem; font-weight: bold;
            color: #fff; cursor: pointer; transition: all 0.08s ease;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .opt-btn:active { transform: translateY(2px); border-bottom-width: 2px; background: #475569; }
        .opt-btn.correct { background: var(--accent-green) !important; color: #0f172a !important; }
        .opt-btn.wrong { background: #ef4444 !important; color: #fff !important; }

        /* Modal 蓋板 */
        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
        }
        .modal-card {
            background: var(--card-bg); border: 3px solid var(--accent-cyan);
            border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center;
        }
        .start-btn {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none; border-bottom: 4px solid #0284c7; color: #fff;
            font-size: 1.2rem; font-weight: bold; padding: 12px 25px; border-radius: 50px;
            margin-top: 15px; cursor: pointer; width: 100%;
        }
        .start-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 頂部 HUD -->
        <div class="hud">
            <div class="hud-btn-group">
                <button class="hud-icon-btn" id="sound-btn" onclick="toggleSound()" title="音效開關">🔊</button>
                <button class="hud-icon-btn" id="vibrate-btn" onclick="toggleVibrate()" title="震動開關">📳</button>
                <button class="hud-icon-btn" onclick="togglePause()" title="暫停遊戲">⏸️</button>
            </div>
            <div class="score-box">
                <div>BEST: <span id="high-score" class="high-score">0</span></div>
                <div>SCORE: <span id="score">0</span></div>
            </div>
        </div>

        <div class="progress-text">矩陣進度：<span id="current-q-num">1</span> / 25</div>

        <!-- 主遊戲區域 -->
        <div class="main-game-area">
            <div class="question-title" id="question-text">4 × 3 = ?</div>

            <div class="matrix-card">
                <div class="matrix-grid" id="matrix-grid"></div>
            </div>
        </div>

        <!-- 4 個選項按鈕 -->
        <div class="options-grid" id="options-grid"></div>

        <!-- 結算/暫停 Modal -->
        <div id="game-modal" class="modal hidden">
            <div class="modal-card">
                <div style="font-size: 3.5rem; margin-bottom: 10px;" id="modal-icon">📐</div>
                <h2 id="modal-title" style="color:var(--accent-cyan); margin: 5px 0;">矩陣充能完成</h2>
                <p id="modal-desc" style="color:#94a3b8; font-size:0.9rem; margin-bottom:15px;">本次訓練得分：0</p>
                <button class="start-btn" onclick="startGame()">開始矩陣特訓 ⚡</button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API 音效與觸控震動控制
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;
        let vibrateEnabled = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function triggerVibrate(ms = 40) {
            if (vibrateEnabled && navigator.vibrate) {
                navigator.vibrate(ms);
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        function toggleVibrate() {
            vibrateEnabled = !vibrateEnabled;
            document.getElementById('vibrate-btn').innerText = vibrateEnabled ? '📳' : '📴';
            if (vibrateEnabled) triggerVibrate(30);
        }

        let currentQuestion = 0;
        let totalQuestions = 25;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('matrix_high_score')) || 0;
        let correctAnswer = 0;
        let isAnsweringLocked = false;

        let rows = 0, cols = 0;
        let quizMode = 'show_formula'; // 'show_formula' (看算式找積) 或 'show_matrix' (看圖找算式)

        function generateQuestion() {
            isAnsweringLocked = false;
            rows = Math.floor(Math.random() * 8) + 2; // 2 ~ 9
            cols = Math.floor(Math.random() * 8) + 2; // 2 ~ 9
            correctAnswer = rows * cols;

            quizMode = Math.random() > 0.5 ? 'show_formula' : 'show_matrix';

            const qText = document.getElementById('question-text');
            if (quizMode === 'show_formula') {
                qText.innerText = `${rows} × ${cols} = ?`;
            } else {
                qText.innerText = `這塊矩陣是代表哪一個算式？`;
            }

            document.getElementById('current-q-num').innerText = currentQuestion + 1;
            renderMatrixGrid();
            generateOptions();
        }

        function renderMatrixGrid() {
            const grid = document.getElementById('matrix-grid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell active';
                    grid.appendChild(cell);
                }
            }
        }

        function generateOptions() {
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            let options = [];
            if (quizMode === 'show_formula') {
                options.push(correctAnswer.toString());
                while (options.length < 4) {
                    let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                    let wrongOpt = (correctAnswer + offset).toString();
                    if (parseInt(wrongOpt) > 0 && !options.includes(wrongOpt)) {
                        options.push(wrongOpt);
                    }
                }
            } else {
                const correctFormula = `${rows} × ${cols}`;
                options.push(correctFormula);
                while (options.length < 4) {
                    let r = Math.floor(Math.random() * 8) + 2;
                    let c = Math.floor(Math.random() * 8) + 2;
                    let wrongFormula = `${r} × ${c}`;
                    if (!options.includes(wrongFormula)) {
                        options.push(wrongFormula);
                    }
                }
            }

            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            if (isAnsweringLocked) return;

            const isCorrect = (quizMode === 'show_formula' && parseInt(selected) === correctAnswer) ||
                              (quizMode === 'show_matrix' && selected === `${rows} × ${cols}`);

            if (isCorrect) {
                isAnsweringLocked = true;
                btn.classList.add('correct');
                playSound('correct');
                triggerVibrate(50);
                score += 10;
                document.getElementById('score').innerText = score;

                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion >= totalQuestions) {
                        endGame();
                    } else {
                        generateQuestion();
                    }
                }, 400);
            } else {
                btn.classList.add('wrong');
                playSound('wrong');
                triggerVibrate(100);
                setTimeout(() => btn.classList.remove('wrong'), 600);
            }
        }

        function togglePause() {
            document.getElementById('modal-icon').innerText = "⏸️";
            document.getElementById('modal-title').innerText = "矩陣特訓暫停中";
            document.getElementById('modal-desc').innerText = `當前進度：${currentQuestion + 1} / ${totalQuestions}`;
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function endGame() {
            let isNewHigh = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('matrix_high_score', highScore);
                isNewHigh = true;
            }

            document.getElementById('modal-icon').innerText = isNewHigh ? "🏆" : "📐";
            document.getElementById('modal-title').innerText = isNewHigh ? "🎉 突破新紀錄！" : "矩陣充能完成！";
            document.getElementById('modal-desc').innerText = `最終總分：${score} (最高紀錄: ${highScore})`;
            document.getElementById('game-modal').classList.remove('hidden');
            updateScoreUI();
        }

        function startGame() {
            initAudio();
            currentQuestion = 0;
            score = 0;
            updateScoreUI();
            document.getElementById('game-modal').classList.add('hidden');
            generateQuestion();
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('high-score').innerText = highScore;
        }

        updateScoreUI();
        generateQuestion();
    </script>
</body>
</html>
